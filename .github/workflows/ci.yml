name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog 生成需要 git 历史

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 全量校验 + 构建：gen:data(发版数/日志) → sidebar/写死版本/死链 → SSG → 锚点
      - name: 构建与全量校验
        run: pnpm build

      - name: 兜底版本漂移哨兵
        run: pnpm check:fallback
