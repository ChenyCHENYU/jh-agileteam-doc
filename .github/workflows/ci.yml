name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本跟随 package.json 的 packageManager 字段（pnpm@11.x），勿在此硬编码
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 全量校验 + 构建：typecheck → gen:data → sidebar/孤儿页/写死版本/团队数据/死链 → SSG → sitemap/体积/锚点
      - name: 构建与全量校验
        run: pnpm build

      - name: 兜底版本漂移哨兵
        run: pnpm check:fallback

      # 构建失败通知飞书群（在仓库 Settings → Secrets 配置 FEISHU_WEBHOOK_URL 后生效）
      - name: 飞书失败通知
        if: failure()
        run: |
          if [ -z "${{ secrets.FEISHU_WEBHOOK_URL }}" ]; then
            echo "未配置 FEISHU_WEBHOOK_URL，跳过通知"
            exit 0
          fi
          curl -s -X POST "${{ secrets.FEISHU_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"text\",
              \"content\": {\"text\": \"🚨 文档站 CI 失败\n仓库: ${{ github.repository }}\n提交: ${{ github.event.head_commit.message }}\n触发人: ${{ github.actor }}\n详情: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}
            }"
